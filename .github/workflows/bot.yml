name: Bot de Noticias Ecuador

on:
  schedule:
    # Se ejecuta cada hora (formato cron UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutar manualmente el bot desde GitHub cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurar base de datos de noticias
        uses: actions/cache@v4
        with:
          path: noticias.db
          key: noticias-db-${{ github.run_id }}
          restore-keys: |
            noticias-db-

      - name: Ejecutar script de noticias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python news_bot.py
